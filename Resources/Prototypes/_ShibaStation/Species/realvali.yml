- type: markingPoints
  id: MobRealvaliMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    Tail:
      points: 2
      required: true
      defaultMarkings: [ RealvaliTail, RealvaliTailFeathers ]
    Head:
      points: 2
      required: false
    Chest:
      points: 1
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

